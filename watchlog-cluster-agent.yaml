apiVersion: v1
kind: ServiceAccount
metadata:
  name: watchlog-cluster-agent
  namespace: default

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: watchlog-cluster-role
rules:
  - apiGroups: [""]
    resources:
      ["nodes", "pods", "namespaces", "events", "services", "endpoints",
       "persistentvolumes", "persistentvolumeclaims", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "daemonsets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: watchlog-cluster-agent-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: watchlog-cluster-role
subjects:
  - kind: ServiceAccount
    name: watchlog-cluster-agent
    namespace: default

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: watchlog-cluster-agent
  namespace: default
  labels:
    app: watchlog-cluster-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: watchlog-cluster-agent
  template:
    metadata:
      labels:
        app: watchlog-cluster-agent
    spec:
      serviceAccountName: watchlog-cluster-agent
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet

      # فقط روی نودی با hostname = minikube اجرا شود
      nodeSelector:
        kubernetes.io/hostname: minikube

      containers:
        - name: cluster-agent
          image: watchlog/watchlog-cluster-agent:latest
          imagePullPolicy: Always
          env:
            - name: UUID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: WATCHLOG_APIKEY
              value: "8ed204e18781f2c99c6e0bf101ce44d8"
            - name: WATCHLOG_SERVER
              value: "http://192.168.10.164:7896"
            - name: WATCHLOG_CLUSTER_NAME
              value: "dev"
            # --- v2 snapshot pipeline configuration ---
            - name: K8S_COLLECTION_INTERVAL
              value: "60000"
            - name: K8S_COLLECT_EVENTS
              value: "true"
            - name: K8S_COLLECT_TOPOLOGY
              value: "true"
            - name: K8S_COLLECT_LOGS
              value: "true"
            - name: K8S_LOG_LINES
              value: "100"
            - name: K8S_MAX_PODS
              value: "1000"
            - name: K8S_MAX_EVENTS
              value: "500"
            - name: K8S_COMPRESSION
              value: "true"
            # Keep legacy `kubernetesMetrics` emit during migration; set "false"
            # once the v2 backend read path is live.
            - name: K8S_LEGACY_METRICS
              value: "true"
          resources:
            requests:
              cpu:    "200m"
              memory: "256Mi"
            limits:
              cpu:    "1"
              memory: "1Gi"
