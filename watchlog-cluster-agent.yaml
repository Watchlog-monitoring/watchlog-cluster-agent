apiVersion: v1
kind: ServiceAccount
metadata:
  name: watchlog-cluster-agent
  namespace: default

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: watchlog-cluster-role
rules:
  - apiGroups: [""]
    resources:
      ["nodes", "pods", "namespaces", "events", "services", "endpoints",
       "persistentvolumes", "persistentvolumeclaims", "pods/log"]
    verbs: ["get", "list", "watch"]
  # Kubelet Summary API (primary metrics source) is reached via the API server
  # node proxy - this is what makes metrics work WITHOUT metrics-server.
  - apiGroups: [""]
    resources: ["nodes/proxy", "nodes/stats", "nodes/metrics"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "daemonsets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  # Optional: only needed if K8S_ENABLE_METRICS_SERVER_FALLBACK=true.
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: watchlog-cluster-agent-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: watchlog-cluster-role
subjects:
  - kind: ServiceAccount
    name: watchlog-cluster-agent
    namespace: default

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: watchlog-cluster-agent
  namespace: default
  labels:
    app: watchlog-cluster-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: watchlog-cluster-agent
  template:
    metadata:
      labels:
        app: watchlog-cluster-agent
    spec:
      serviceAccountName: watchlog-cluster-agent
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet

      containers:
        - name: cluster-agent
          image: watchlog/watchlog-cluster-agent:latest
          # IfNotPresent so a locally-built image (minikube image build) is used
          # for testing. Use Always when pulling a published image from a registry.
          imagePullPolicy: IfNotPresent
          env:
            - name: UUID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: WATCHLOG_APIKEY
              value: "WATCHLOG_APIKEY_GOES_HERE"
            # Stable host address from inside minikube — survives Mac LAN IP/DHCP
            # changes, so you never have to edit this again for local testing.
            # (For a real remote server, replace with its public URL.)
            - name: WATCHLOG_SERVER
              value: "WATCHLOG_SERVER_GOES_HERE"
            - name: WATCHLOG_CLUSTER_NAME
              value: "WATCHLOG_CLUSTER_NAME_GOES_HERE"
            # --- v2 snapshot pipeline configuration ---
            - name: K8S_COLLECTION_INTERVAL
              value: "60000"
            - name: K8S_COLLECT_EVENTS
              value: "true"
            - name: K8S_COLLECT_TOPOLOGY
              value: "true"
            - name: K8S_COLLECT_LOGS
              value: "false"
            - name: K8S_LOG_LINES
              value: "100"
            - name: K8S_MAX_PODS
              value: "1000"
            - name: K8S_MAX_EVENTS
              value: "500"
            # A pod is "warning" only if it restarted within this many minutes
            # (recency window) — old restarts no longer flag a healthy pod.
            - name: K8S_RESTART_WINDOW_MIN
              value: "30"
            - name: K8S_COMPRESSION
              value: "true"
            # --- runtime metrics: Kubelet Summary API (NO metrics-server needed) ---
            - name: K8S_METRICS_SOURCE
              value: "kubelet_summary"
            - name: K8S_KUBELET_SUMMARY_TIMEOUT_MS
              value: "5000"
            - name: K8S_KUBELET_SUMMARY_CONCURRENCY
              value: "3"
            # metrics-server is an OPTIONAL fallback only; default OFF.
            - name: K8S_ENABLE_METRICS_SERVER_FALLBACK
              value: "false"
            # Legacy `kubernetesMetrics` emit (used metrics-server) - off by default.
            - name: K8S_LEGACY_METRICS
              value: "false"
          resources:
            requests:
              cpu:    "200m"
              memory: "256Mi"
            limits:
              cpu:    "1"
              memory: "1Gi"
